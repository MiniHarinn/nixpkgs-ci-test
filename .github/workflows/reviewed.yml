name: Reviewed

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  trigger:
    runs-on: ubuntu-slim
    steps:
      - run: echo This is a no-op only used as a trigger for workflow_run.

  # Hand off identifiers to the `Review` workflow, which runs in the
  # privileged workflow_run context. Only PR and review IDs are written;
  # everything else (state, body, author) is re-fetched server-side by the
  # consumer so the artifact is not used as a source of truth.
  upload:
    name: Upload review identifiers
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            fs.writeFileSync('review-info.json', JSON.stringify({
              pr_number: context.payload.pull_request.number,
              review_id: context.payload.review.id,
            }))

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-info
          path: review-info.json
          retention-days: 1
          if-no-files-found: error
