name: Review

on:
  workflow_run:
    workflows:
      - Reviewed
    types: [completed]

# This is used as fallback without app only.
# This happens when testing in forks without setting up that app.
permissions:
  actions: read # downloading the review-info artifact from the upstream Reviewed run
  pull-requests: write # minimizing dismissed reviews and adding reactions

defaults:
  run:
    shell: bash

jobs:
  process:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    # Skip Reviewed runs that didn't upload an artifact (e.g. action_required
    # gate expired, runner error). For those, the bot.yml cron path still merges.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/github-script

      # Use the GitHub App to make sure the reaction happens with the same user who will later merge.
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        if: github.event_name != 'pull_request' && vars.NIXPKGS_CI_APP_ID
        id: app-token
        with:
          app-id: ${{ vars.NIXPKGS_CI_APP_ID }}
          private-key: ${{ secrets.NIXPKGS_CI_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          retries: 3
          script: |
            const fs = require('fs')
            const { handleMergeComment } = require('./ci/github-script/merge.js')

            const { action, review } = JSON.parse(
              fs.readFileSync('review-info.json', 'utf-8'),
            )

            // The `check` workflow creates review comments which reviewers
            // are encouraged to manually dismiss if they're not relevant.
            // When a CI-generated review is dismissed, this job automatically
            // minimizes it, preventing it from cluttering the PR.
            if (
              action === 'dismissed' &&
              review.user_login === 'github-actions[bot]' &&
              review.state === 'DISMISSED'
            ) {
              await github.graphql(
                `mutation($node_id: ID!) {
                  minimizeComment(input: {
                    classifier: RESOLVED,
                    subjectId: $node_id
                  })
                  { clientMutationId }
                }`,
                { node_id: review.node_id },
              )
            }

            // The `bot` workflow reacts to comments with @NixOS/nixpkgs-merge-bot
            // references, but might only pick up a comment after up to 10 minutes.
            // To give the user instant feedback, this job adds a reaction.
            if (action === 'submitted') {
              await handleMergeComment({
                github,
                body: review.body,
                node_id: review.node_id,
                reaction: 'EYES',
              })
            }
